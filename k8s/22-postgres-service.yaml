apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskflow
spec:
  # Доступ потрібен лише всередині кластера.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskflow
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
