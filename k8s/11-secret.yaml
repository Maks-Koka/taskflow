# Чутливі значення. Це демонстраційні дані для локального кластера:
# реальних паролів від робочих систем тут немає.
# stringData дозволяє писати значення у відкритому вигляді —
# Kubernetes сам закодує їх у base64 під час створення об'єкта.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  DB_PASSWORD: "taskflow_k8s_demo_pw"
  INTERNAL_TOKEN: "k8s-demo-internal-token"
