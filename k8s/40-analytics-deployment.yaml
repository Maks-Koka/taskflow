apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: taskflow
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/version: 1.0.0
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
      app.kubernetes.io/part-of: taskflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: taskflow
    spec:
      containers:
        - name: analytics
          image: taskflow/analytics:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: TASKS_API_URL
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: TASKS_API_URL }
            - name: SHOW_PRIORITY_BREAKDOWN
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: SHOW_PRIORITY_BREAKDOWN }
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: taskflow-secret, key: INTERNAL_TOKEN }
          volumeMounts:
            - name: config-files
              mountPath: /etc/taskflow
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: config-files
          configMap:
            name: taskflow-config
            items:
              - key: banner.txt
                path: banner.txt
