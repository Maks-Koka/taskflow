apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: tasks-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/version: 1.0.0
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
      app.kubernetes.io/part-of: taskflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: taskflow
    spec:
      containers:
        - name: tasks-api
          image: taskflow/tasks-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "1.0.0"
            # --- нечутливі параметри з ConfigMap ---
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: DB_USER }
            - name: MAX_TITLE_LENGTH
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: MAX_TITLE_LENGTH }
            - name: FEATURE_STATS
              valueFrom:
                configMapKeyRef: { name: taskflow-config, key: FEATURE_STATS }
            # --- чутливий параметр із Secret ---
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: taskflow-secret, key: DB_PASSWORD }
          volumeMounts:
            # Той самий ConfigMap, підключений як файл.
            - name: config-files
              mountPath: /etc/taskflow
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: config-files
          configMap:
            name: taskflow-config
            items:
              - key: banner.txt
                path: banner.txt
