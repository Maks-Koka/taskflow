# Компонент зі станом — база даних. Дані переживають перестворення пода.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: taskflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
