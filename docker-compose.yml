name: taskflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow_dev_pw}
      POSTGRES_DB: ${DB_NAME:-taskflow}
    ports:
      - "${DB_PORT_HOST:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskflow} -d ${DB_NAME:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [taskflow]

  tasks-api:
    build:
      context: ./services/tasks-api
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: taskflow/tasks-api:${APP_VERSION:-1.0.0}
    container_name: taskflow-tasks-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow_dev_pw}
      DB_NAME: ${DB_NAME:-taskflow}
      MAX_TITLE_LENGTH: "120"
      FEATURE_STATS: "true"
    ports:
      - "${TASKS_API_PORT_HOST:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [taskflow]

  analytics:
    build:
      context: ./services/analytics
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: taskflow/analytics:${APP_VERSION:-1.0.0}
    container_name: taskflow-analytics
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      TASKS_API_URL: http://tasks-api:3000
      SHOW_PRIORITY_BREAKDOWN: "true"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "${ANALYTICS_PORT_HOST:-8001}:8000"
    depends_on:
      - tasks-api
    networks: [taskflow]

  web:
    build:
      context: ./services/web
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: taskflow/web:${APP_VERSION:-1.0.0}
    container_name: taskflow-web
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      TASKS_API_UPSTREAM: tasks-api:3000
      ANALYTICS_UPSTREAM: analytics:8000
    ports:
      - "${WEB_PORT_HOST:-8090}:8080"
    depends_on:
      - tasks-api
      - analytics
    networks: [taskflow]

volumes:
  pgdata:

networks:
  taskflow:
    driver: bridge
