name: CI

# Лабораторна робота №2 — Continuous Integration.
#
# Пайплайн запускається:
#   * на кожен push у робочу гілку main;
#   * на кожну зміну у Pull Request, націленому на main.
#
# Структура:
#   tasks-api / analytics / web   — незалежні паралельні завдання (build + lint + test)
#   images                        — збірка образів, залежить від усіх трьох
#   publish                       — публікація в GHCR, лише для push (не для PR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Нові коміти в тій самій гілці скасовують попередній запуск.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1. tasks-api: Node.js 20 — лінт, юніт-тести, інтеграційні тести з живою БД
  # ---------------------------------------------------------------------------
  tasks-api:
    name: tasks-api · build · lint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tasks-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_ci_pw
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (з кешем npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/tasks-api/package-lock.json

      # Build: встановлення залежностей рівно за lock-файлом
      - name: Build — npm ci
        run: npm ci

      # Статичний аналіз — блокуючий крок (--max-warnings=0)
      - name: Lint — ESLint
        run: npm run lint

      - name: Test — юніт-тести
        run: npm run test:unit

      - name: Test — інтеграційні тести (реальний PostgreSQL)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: taskflow
          DB_PASSWORD: taskflow_ci_pw
          DB_NAME: taskflow
        run: npm run test:integration

      - name: Coverage
        run: npm test

      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tasks-api
          path: services/tasks-api/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. analytics: Python 3.12 — ruff + pytest
  # ---------------------------------------------------------------------------
  analytics:
    name: analytics · build · lint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (з кешем pip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/analytics/requirements-dev.txt

      - name: Build — встановлення залежностей
        run: pip install -r requirements-dev.txt

      # Статичний аналіз — блокуючий крок
      - name: Lint — ruff
        run: ruff check --output-format=github .

      - name: Test — pytest із покриттям
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-analytics
          path: services/analytics/coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. web: перевірка конфігурації nginx і статики
  # ---------------------------------------------------------------------------
  web:
    name: web · build · lint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (з кешем npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Build — npm ci
        run: npm ci

      # Статичний аналіз — блокуючі кроки
      - name: Lint — ESLint (браузерний конфіг)
        run: npm run lint

      - name: Lint — HTMLHint
        run: npm run lint:html

      # Build/Test: шаблон має підставитись і nginx має прийняти конфігурацію
      - name: Test — конфігурація nginx валідна
        run: |
          docker run --rm \
            -e APP_VERSION=ci \
            -e TASKS_API_UPSTREAM=tasks-api:3000 \
            -e ANALYTICS_UPSTREAM=analytics:8000 \
            -v "$PWD/templates:/etc/nginx/templates:ro" \
            nginx:1.27-alpine \
            sh -c 'envsubst "\$APP_VERSION \$TASKS_API_UPSTREAM \$ANALYTICS_UPSTREAM" \
                     < /etc/nginx/templates/default.conf.template \
                     > /etc/nginx/conf.d/default.conf && nginx -t'

  # ---------------------------------------------------------------------------
  # 4. images: збірка контейнерних образів + сканування на вразливості
  #    Залежить від успіху всіх трьох завдань вище.
  # ---------------------------------------------------------------------------
  images:
    name: image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [tasks-api, analytics, web]
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, analytics, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build образу (локально, без публікації)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: taskflow/${{ matrix.service }}:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Блокуючий крок: критичні та високі вразливості валять збірку
      - name: Сканування образу (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: taskflow/${{ matrix.service }}:ci-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library

  # ---------------------------------------------------------------------------
  # 5. publish: публікація образів у GitHub Container Registry
  #    Лише для push у гілку, ніколи для Pull Request.
  # ---------------------------------------------------------------------------
  publish:
    name: publish · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, analytics, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Автентифікація через вбудований GITHUB_TOKEN — жодних секретів у репозиторії
      - name: Вхід у GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги та мітки образу
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskflow-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ github.run_number }},prefix=build-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=taskflow-${{ matrix.service }}
            org.opencontainers.image.description=TaskFlow ${{ matrix.service }} service

      - name: Збірка та публікація
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=build-${{ github.run_number }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Опубліковані теги
        run: |
          echo "### Опубліковано \`taskflow-${{ matrix.service }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
