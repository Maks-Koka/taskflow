apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.secretName" . }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "secret") | nindent 4 }}
type: Opaque
# Значення беруться виключно зі значень чарта: у самому шаблоні
# жодного пароля не записано.
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword є обов'язковим" .Values.secrets.dbPassword | quote }}
  INTERNAL_TOKEN: {{ required "secrets.internalToken є обов'язковим" .Values.secrets.internalToken | quote }}
