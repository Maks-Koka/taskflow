apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskflow.componentName" (dict "root" . "component" "web") }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "taskflow.componentSelectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskflow.componentLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "taskflow.image" (dict "root" . "svc" .Values.web) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: {{ default .Values.image.tag .Values.web.image.tag | quote }}
            - name: TASKS_API_UPSTREAM
              value: {{ printf "%s:%v" (include "taskflow.componentName" (dict "root" . "component" "tasks-api")) .Values.tasksApi.service.port | quote }}
            - name: ANALYTICS_UPSTREAM
              value: {{ printf "%s:%v" (include "taskflow.componentName" (dict "root" . "component" "analytics")) .Values.analytics.service.port | quote }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: 6
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
